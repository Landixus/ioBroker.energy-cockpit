name: Linux layout regressions
on: workflow_dispatch
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci && npm run build
      - run: npx playwright install --with-deps chromium
      - run: node tools/upstream-tests.mjs flow-3d
      - run: node tools/upstream-tests.mjs stats-stable
        if: always()
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: layout-regressions
          path: test-results/
